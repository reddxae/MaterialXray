org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.configuration-cache=true
# Lint analysis, KSP and the Kotlin compile tasks are all cacheable, so repeating a build after
# switching branches or reverting an edit reuses their output instead of redoing the work.
org.gradle.caching=true
org.gradle.parallel=true
