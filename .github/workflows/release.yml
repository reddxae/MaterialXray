name: Release

on:
  workflow_dispatch:

jobs:
  release-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-37.0" "cmake;3.31.6"

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          for secret_name in ANDROID_KEYSTORE_BASE64 RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD RELEASE_STORE_PASSWORD; do
            if [ -z "${!secret_name}" ]; then
              echo "$secret_name is not configured" >&2
              exit 1
            fi
          done

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ env.RELEASE_KEYSTORE_PATH }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: ./gradlew --stacktrace app:assembleRelease

      - name: Prepare release APK artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [ -z "$version_name" ]; then
            echo "Failed to read versionName from app/build.gradle.kts" >&2
            exit 1
          fi

          short_sha="${GITHUB_SHA::7}"
          apk_name="MaterialXray-v${version_name}-${short_sha}.apk"
          apk_path="app/build/outputs/apk/release/${apk_name}"
          cp app/build/outputs/apk/release/app-release.apk "$apk_path"

          echo "apk_name=$apk_name" >> "$GITHUB_OUTPUT"
          echo "apk_path=$apk_path" >> "$GITHUB_OUTPUT"
          echo "version_tag=v$version_name" >> "$GITHUB_OUTPUT"

      - name: Prepare Xray corresponding source
        id: xray-source
        shell: bash
        run: |
          set -euo pipefail
          xray_version="$(< third_party/xray/VERSION)"
          source_name="Xray-core-${xray_version}-source.tar.gz"
          source_path="app/build/outputs/xray-source/${source_name}"
          ./scripts/prepare-xray-source.sh "$xray_version" "$source_path"
          echo "source_name=$source_name" >> "$GITHUB_OUTPUT"
          echo "source_path=$source_path" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            ${{ steps.artifact.outputs.apk_path }}
            ${{ steps.xray-source.outputs.source_path }}

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.apk_name }}
          path: ${{ steps.artifact.outputs.apk_path }}
          if-no-files-found: error

      - name: Upload Xray corresponding source
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.xray-source.outputs.source_name }}
          path: ${{ steps.xray-source.outputs.source_path }}
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_TAG: ${{ steps.artifact.outputs.version_tag }}
          APK_PATH: ${{ steps.artifact.outputs.apk_path }}
          APK_NAME: ${{ steps.artifact.outputs.apk_name }}
          XRAY_SOURCE_PATH: ${{ steps.xray-source.outputs.source_path }}
          XRAY_SOURCE_NAME: ${{ steps.xray-source.outputs.source_name }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/tags/${VERSION_TAG}:refs/tags/${VERSION_TAG}"
            tag_commit="$(git rev-list -n 1 "$VERSION_TAG")"
            if [ "$tag_commit" != "$GITHUB_SHA" ]; then
              echo "$VERSION_TAG already points to $tag_commit, not $GITHUB_SHA" >&2
              exit 1
            fi
            gh release upload "$VERSION_TAG" \
              "$APK_PATH#${APK_NAME}" \
              "$XRAY_SOURCE_PATH#${XRAY_SOURCE_NAME}" \
              --clobber
          else
            gh release create "$VERSION_TAG" \
              "$APK_PATH#${APK_NAME}" \
              "$XRAY_SOURCE_PATH#${XRAY_SOURCE_NAME}" \
              --target "$GITHUB_SHA" \
              --title "$VERSION_TAG" \
              --generate-notes
          fi
