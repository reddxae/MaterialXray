# Compose-specific detekt adjustments.
# See https://detekt.dev/docs/introduction/compose
config:
  validation: true

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][_A-Za-z0-9]*'

complexity:
  CyclomaticComplexMethod:
    allowedComplexity: 20
    ignoreNestingFunctions: true
    ignoreSimpleWhenEntries: true
  LargeClass:
    allowedLines: 1200
  LongMethod:
    active: false
  LongParameterList:
    allowedFunctionParameters: 12
    ignoreDefaultParameters: true
  TooManyFunctions:
    allowedFunctionsPerClass: 35
    ignorePrivate: true
    ignoreOverridden: true
    ignoreAnnotatedFunctions: ['Preview']

style:
  MaxLineLength:
    active: false
  MagicNumber:
    active: false
  ReturnCount:
    active: false
  UnusedPrivateFunction:
    ignoreAnnotated: ['Preview']
